<!DOCTYPE html>
<html lang="ta">
<head>
<link rel="icon" href="app_assets.png" type="image/png">
<link rel="apple-touch-icon" href="app_assets.png">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Drug Anonymous Alert System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        h2 { color: #d9534f; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; }
        textarea { width: 100%; height: 90px; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        input[type="file"] { margin: 10px 0; width: 100%; }
        button { background-color: #d9534f; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background-color: #c9302c; }
        .location-box { background: #eef7ee; color: #2e7d32; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; display: none; margin-top: 10px; }
        .security-note { font-size: 11px; color: #777; margin-top: 15px; background: #fff8e1; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚨 ரகசியப் புகார் தளம்</h2>
    <div class="subtitle">போதைப்பொருள் தடுப்பு - 100% பாதுகாப்பானது & அநாமதேயமானது</div>

    <form id="reportForm">
        <textarea id="reportDetails" placeholder="சம்பவம், நபர்கள் அல்லது இடம் பற்றிய விவரங்களை எழுதவும்..." required></textarea>
        
        <div style="font-size: 13px; font-weight: bold; text-align: left; margin-top: 10px;">புகைப்படம் அல்லது வீடியோ இணைக்கவும்:</div>
        <input type="file" id="mediaUpload" accept="image/*,video/*">

        <div id="locationStatus" class="location-box">📍 GPS இருப்பிடம் பெறப்பட்டது!</div>

        <button type="submit" id="submitBtn">புகாரைச் சமர்ப்பி (Submit)</button>
    </form>

    <div class="security-note">
        🔒 <b>பாதுகாப்பு உறுதிப்பாடு:</b> உங்கள் பெயர், மொபைல் எண் அல்லது IP அட்ரஸ் சேமிக்கப்படாது.
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBeTwiRPYZCMru4e2dDfey9_-7OUJ-fYTE",
    authDomain: "people-safety-b341b.firebaseapp.com",
    projectId: "people-safety-b341b",
    storageBucket: "people-safety-b341b.firebasestorage.app",
    messagingSenderId: "72711788900",
    appId: "1:72711788900:web:3aa7c75ce29e8d0ad18271",
    measurementId: "G-P5F626HXXJ"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let userLatitude = null;
  let userLongitude = null;

  if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
          userLatitude = position.coords.latitude;
          userLongitude = position.coords.longitude;
          document.getElementById('locationStatus').style.display = 'block';
      });
  }

  document.getElementById('reportForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const details = document.getElementById('reportDetails').value;
      const fileInput = document.getElementById('mediaUpload');
      let mediaUrl = null;

      submitBtn.innerText = "அனுப்பப்படுகிறது...";
      submitBtn.disabled = true;

      try {
          if (fileInput.files.length > 0) {
              const file = fileInput.files[0];
              const formData = new FormData();
              formData.append("file", file);
              formData.append("upload_preset", "Safety_upload"); 

              const cloudName = "hjvvckod"; 
              const resourceType = file.type.startsWith("video") ? "video" : "image";

              const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/${resourceType}/upload`, {
                  method: "POST",
                  body: formData
              });

              const result = await response.json();
              if (result.secure_url) {
                  mediaUrl = result.secure_url;
              } else {
                  throw new Error(result.error?.message || "Media upload failed");
              }
          }

          await db.collection("reports").add({
              details: details,
              mediaUrl: mediaUrl,
              latitude: userLatitude,
              longitude: userLongitude,
              status: "URGENT",
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });

          alert("✅ புகார் வெற்றிகரமாக அனுப்பப்பட்டது!");
          document.getElementById('reportForm').reset();
          document.getElementById('locationStatus').style.display = 'none';
      } catch (error) {
          alert("❌ பிழை ஏற்பட்டது: " + error.message);
      } finally {
          submitBtn.innerText = "புகாரைச் சமர்ப்பி (Submit)";
          submitBtn.disabled = false;
      }
  });
</script>

</body>
</html>
