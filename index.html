<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">

    <!-- PWA Manifest & Meta Tags for Add to Home Screen Icon -->

            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;

        .app-logo {
            width: 120px; height: 120px; border-radius: 50%;
            object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px; animation: pulse 1.5s infinite;

            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }

        textarea { resize: vertical; height: 80px; }

        .btn:hover { background-color: #286090; }

        <h2 style="color: #d9534f; margin: 0;">ADA Safety App</h2>

            </div>

                <label>புகார் விவரம் (Complaint Details):</label>

            </div>

        function updateTaluks() {
            const districtSelect = document.getElementById('district');
            const talukSelect = document.getElementById('taluk');
            const selectedDistrict = districtSelect.value;

            talukSelect.innerHTML = '<option value="">தாலுகாவைத் தேர்ந்தெடுக்கவும்</option>';

            if (selectedDistrict && districtTaluks[selectedDistrict]) {
                districtTaluks[selectedDistrict].forEach(taluk => {
                    const option = document.createElement('option');
                    option.value = taluk;
                    option.textContent = taluk;
                    talukSelect.appendChild(option);
                });
            }
        }

        // 5 விநாடிகள் லোগோ ஸ்பிளாஸ் ஸ்கிரீன் இயங்குவது
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const mainContent = document.getElementById('main-content');
                if(splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.display = 'none';
                        mainContent.style.display = 'block';
                    }, 500);
                }
            }, 5000); // 5 விநாடிகள்
        });

        // GPS லொகேஷன் எடுக்கும் வசதி
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    document.getElementById('latitude').value = position.coords.latitude;
                    document.getElementById('longitude').value = position.coords.longitude;
                    document.getElementById('gpsStatus').value = `GPS வெற்றிகரமாக பெறப்பட்டது: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
                }, error => {
                    alert("GPS லொகேஷன் பெறுவதில் பிழை: " + error.message);
                });
            } else {
                alert("உங்கள் பிரவுசர் GPS லொகேஷனை ஆதரிக்கவில்லை.");
            }
        }

        // புகார் சமர்ப்பித்தல் மற்றும் மீடியா ஃபைல்களை அப்லோட் செய்தல்
        async function submitComplaint(event) {
            event.preventDefault();

            const state = document.getElementById('state').value;
            const district = document.getElementById('district').value;
            const taluk = document.getElementById('taluk').value;
            const locationInput = document.getElementById('locationName').value;
            const details = document.getElementById('details').value;
            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;

            const fullLocationName = `${state} > ${district} மாவட்டம் > ${taluk} தாலுகா > இடம்: ${locationInput}`;

            alert("புகார் பதிவு செய்யப்படுகிறது, தயவுசெய்து காத்திருக்கவும்...");

            try {
                let imageUrl = "";
                let videoUrl = "";
                let audioUrl = "";

                // புகைப்படம் அப்லோட்
                const imageFile = document.getElementById('imageFile').files[0];
                if (imageFile) {
                    const imageRef = storage.ref('images/' + Date.now() + '_' + imageFile.name);
                    const snapshot = await imageRef.put(imageFile);
                    imageUrl = await snapshot.ref.getDownloadURL();
                }

                // வீடியோ அப்லோட்
                const videoFile = document.getElementById('videoFile').files[0];
                if (videoFile) {
                    const videoRef = storage.ref('videos/' + Date.now() + '_' + videoFile.name);
                    const snapshot = await videoRef.put(videoFile);
                    videoUrl = await snapshot.ref.getDownloadURL();
                }

                // ஆடியோ அப்லோட்
                const audioFile = document.getElementById('audioFile').files.name; // fixed syntax below inside script if needed
                if (document.getElementById('audioFile').files[0]) {
                    const audioFileObj = document.getElementById('audioFile').files[0];
                    const audioRef = storage.ref('audios/' + Date.now() + '_' + audioFileObj.name);
                    const snapshot = await audioRef.put(audioFileObj);
                    audioUrl = await snapshot.ref.getDownloadURL();
                }

                // Firestore-ல் சேமித்தல்
                await db.collection("reports").add({
                    state: state,
                    district: district,
                    taluk: taluk,
                    locationName: fullLocationName,
                    details: details,
                    imageUrl: imageUrl,
                    videoUrl: videoUrl,
                    audioUrl: audioUrl,
                    latitude: latitude ? parseFloat(latitude) : null,
                    longitude: longitude ? parseFloat(longitude) : null,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("புகார் வெற்றிகரமாகப் பதிவு செய்யப்பட்டது!");
                document.getElementById('complaintForm').reset();
                document.getElementById('gpsStatus').value = "GPS லொகேஷன் எடுக்கப்படவில்லை";

            } catch (error) {
                alert("பிழை ஏற்பட்டது: " + error.message);
            }
        }
    </script>
