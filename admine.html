    function requestNotificationPermission() {

    function playPoliceEmergencyAlarm() {
        try {
            if (!alarmAudioContext) {
                alarmAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (alarmAudioContext.state === 'suspended') {
                alarmAudioContext.resume();
            }

            if (alarmInterval) clearInterval(alarmInterval);

            alarmInterval = setInterval(() => {
                let osc = alarmAudioContext.createOscillator();
                let gain = alarmAudioContext.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, alarmAudioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, alarmAudioContext.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, alarmAudioContext.currentTime);
                osc.connect(gain);
                gain.connect(alarmAudioContext.destination);
                osc.start();
                osc.stop(alarmAudioContext.currentTime + 0.3);
            }, 500);
        } catch (e) {
            console.log("Audio alarm error:", e);
        }
    }

    async function onDistrictChange() {
        const selectedDistTa = document.getElementById('loginDistrict').value;
        const stationSelect = document.getElementById('loginStation');
        stationSelect.innerHTML = `<option value="">காவல் நிலையத்தைத் தேர்ந்தெடுக்கவும்...</option>`;

        try {
            let docSnap = await db.collection("admin_passwords").doc(distEng).get();
            if (!docSnap.exists) {
                docSnap = await db.collection("admin_passwords").doc(distEng.toLowerCase()).get();
            }

            if (docSnap.exists && docSnap.data().stations) {
                let stations = docSnap.data().stations;
                stations.forEach(station => {
                    stationSelect.innerHTML += `<option value="${station}">${station}</option>`;
                });
            }
        } catch (e) {
            console.log("Station load error:", e);
        }
    }

    function getLevenshteinDistance(a, b) {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;
        const matrix = [];
        for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
        for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1,
                        Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }

    function isPhoneticallySimilar(str1, str2) {
        let clean1 = str1.toLowerCase().replace(/[^a-z0-9]/g, '');
        let clean2 = str2.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (clean1 === clean2) return true;
        let dist = getLevenshteinDistance(clean1, clean2);
        if (dist <= 3) return true;
        let norm1 = clean1.replace(/[aeiou]/g, 'a').replace(/[ckq]/g, 'k').replace(/[phf]/g, 'f').replace(/[vz]/g, 'w');
        let norm2 = clean2.replace(/[aeiou]/g, 'a').replace(/[ckq]/g, 'k').replace(/[phf]/g, 'f').replace(/[vz]/g, 'w');
        return norm1 === norm2 || getLevenshteinDistance(norm1, norm2) <= 2;
    }

    async function checkPasswordAuth(districtEng, inputPassword) {
        if (inputPassword === "tnpolice@2026") return true;

        let cleanInput = inputPassword.trim().toLowerCase();
        let expectedDefaultPwd = (districtEng + "@2026").toLowerCase();

        if (isPhoneticallySimilar(cleanInput, expectedDefaultPwd)) return true;

        try {
            let docSnap = await db.collection("admin_passwords").doc(districtEng).get();
            if (!docSnap.exists) {
                docSnap = await db.collection("admin_passwords").doc(districtEng.toLowerCase()).get();
            }

            if (docSnap.exists && docSnap.data().password) {
                let savedPwd = docSnap.data().password.trim().toLowerCase();
                if (cleanInput === savedPwd || isPhoneticallySimilar(cleanInput, savedPwd)) {
                    return true;
                }
            }
        } catch (err) {
            console.log("Auth Fetch Error:", err);
        }

        return false;
    }

    async function verifyUnifiedAdminLogin() {

            return;
        }

        if (loginType === 'HQ') {
            if (password === "tnpolice@2026" || isPhoneticallySimilar(password, "tnpolice@2026")) {
                currentLoginRole = "HQ";
                currentLoginType = "HQ";
                initDashboard("🚨 தமிழ்நாடு காவல்துறை - தலைமையகம் (HQ)", "மாநிலம் முழுவதிலும் இருந்து பெறப்பட்ட அனைத்து மாவட்டப் புகார்களும் காட்டப்படுகின்றன.");
            } else {
                alert("❌ தவறான தலைமையக கடவுச்சொல்!");
            }
        } else if (loginType === 'District') {
            const selectedDistTa = document.getElementById('loginDistrict').value;
            if (!selectedDistTa) { alert("⚠️ தயவுசெய்து மாவட்டத்தைத் தேர்ந்தெடுக்கவும்!"); return; }

            let distEng = districtEnglishMap[selectedDistTa] || selectedDistTa;
            let success = await checkPasswordAuth(distEng, password);

            if (success) {
                currentLoginRole = selectedDistTa;
                selectedDistrictEng = distEng;

            } else {
                alert("❌ தவறான கடவுச்சொல்! (Incorrect Password)");
            }
        } else if (loginType === 'Station') {
            const selectedDistTa = document.getElementById('loginDistrict').value;
            const selectedStation = document.getElementById('loginStation').value;
            if (!selectedDistTa || !selectedStation) { alert("⚠️ மாவட்டம் மற்றும் காவல் நிலையத்தை சரியாகத் தேர்ந்தெடுக்கவும்!"); return; }

            let distEng = districtEnglishMap[selectedDistTa] || selectedDistTa;
            let success = await checkPasswordAuth(distEng, password);

            if (success) {
                currentLoginRole = selectedStation;
                selectedDistrictEng = distEng;
                currentLoginType = "Station";
                initDashboard(`🚨 ${selectedStation} காவல் நிலையம்`, `${selectedStation} எல்லைக்குட்பட்ட புகார்கள் மட்டும் காட்டப்படுகின்றன.`);
            } else {
                alert("❌ தவறான கடவுச்சொல்! (Incorrect Password)");
            }
        }
    }

    function initDashboard(titleText, subtitleText) {
        document.getElementById('adminLoginCard').style.display = 'none';
        document.getElementById('adminContainer').style.display = 'block';
        document.getElementById('adminPanelTitle').innerText = titleText;
        document.getElementById('adminSubTitle').innerText = subtitleText;
        monitorAdminReportsRealtime();
    }

    function openMediaWindow(dataUrl, type) {
        const win = window.open("", "_blank");
        if (type === 'image') {
            win.document.write(`<img src="${dataUrl}" style="max-width:100%; height:auto;">`);
        } else if (type === 'video') {
            win.document.write(`<video controls src="${dataUrl}" style="max-width:100%; height:auto;" autoplay></video>`);
        } else if (type === 'audio') {
            win.document.write(`<audio controls src="${dataUrl}" autoplay></audio>`);
        }
    }

    function monitorAdminReportsRealtime() {
        const gridContainer = document.getElementById('reportsGridContainer');
        const totalCountBadge = document.getElementById('totalReportsCount');
        
        db.collection("reports").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            let filteredDocs = [];

            snapshot.docChanges().forEach(change => {
                if (change.type === "added" && !isInitialLoad) {
                    const newReport = change.doc.data();
                    let docDistrict = (newReport.district || "").trim().toLowerCase();
                    let docStation = (newReport.policeStation || newReport.talukStation || "").trim().toLowerCase();

                    if (currentLoginType === "HQ" || 
                       (currentLoginType === "District" && (docDistrict === (selectedDistrictEng||"").toLowerCase() || docDistrict === (currentLoginRole||"").toLowerCase())) ||
                       (currentLoginType === "Station" && docStation === (currentLoginRole||"").toLowerCase())) {
                        
                        triggerNewComplaintAlert(newReport);
                    }
                }
            });

            isInitialLoad = false;

            snapshot.forEach(doc => {
                const data = doc.data();
                
                let docDistrict = (data.district || "").trim().toLowerCase();
                let docStation = (data.policeStation || data.talukStation || "").trim().toLowerCase();
                let docLoc = (data.locationName || "").toLowerCase();

                if (currentLoginType === "HQ") {
                    filteredDocs.push({ id: doc.id, ...data });
                } 
                else if (currentLoginType === "District") {
                    let targetDistEng = (selectedDistrictEng || "").trim().toLowerCase();
                    let targetDistTa = (currentLoginRole || "").trim().toLowerCase();
                    
                    if (docDistrict === targetDistEng || docDistrict === targetDistTa || docLoc.includes(targetDistEng)) {
                        filteredDocs.push({ id: doc.id, ...data });
                    }
                } 
                else if (currentLoginType === "Station") {
                    let targetStation = (currentLoginRole || "").trim().toLowerCase();
                    
                    if (docStation === targetStation || docStation.includes(targetStation) || docLoc.includes(targetStation)) {
                        filteredDocs.push({ id: doc.id, ...data });
                    }
                }
            });

            totalCountBadge.innerText = `மொத்த புகார்கள்: ${filteredDocs.length}`;

            if (filteredDocs.length === 0) {
                gridContainer.innerHTML = `<div class="no-data">புதிய புகார்கள் எதுவும் இல்லை.</div>`;
                return;
            }

            gridContainer.innerHTML = "";
            filteredDocs.forEach(data => {
                const docId = data.id;
                let dateStr = "N/A";
                if (data.timestamp && data.timestamp.toDate) {
                    dateStr = data.timestamp.toDate().toLocaleString('ta-IN');
                }

                let currentStatus = data.complaintStatus || "Pending";
                let accuracyScore = data.accuracyPercentage || 50;
                let aiStatusText = data.aiAnalysis || "Suspicious / பரிசீலனையில்";
                let aiReasonText = data.analysisReason || "ஆதாரங்கள் அடிப்படையில் கணக்கிடப்பட்டது";

                let badgeColorClass = accuracyScore >= 70 ? 'badge-true' : (accuracyScore >= 35 ? 'badge-suspicious' : 'badge-fake');

                let aiCardHtml = `
                    <div class="ai-analysis-box" style="background: #f0f4f8; border-left: 4px solid #337ab7; padding: 10px; font-size: 12px; margin-bottom: 10px; border-radius: 6px; color: #333;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <b>🤖 AI உண்மைத் தன்மை:</b>
                            <span class="badge ${badgeColorClass}" style="font-size: 11px; padding: 3px 8px;">${accuracyScore}% - ${aiStatusText}</span>
                        </div>
                        <div style="font-size: 11px; color: #555; margin-top: 4px;">
                            <b>காரணம்:</b> ${aiReasonText}
                        </div>
                    </div>
                `; 
                
                const imgLat = data.imageLocationLat || data.latitude;
                const imgLon = data.imageLocationLon || data.longitude;
                const vidLat = data.videoLocationLat || data.latitude;
                const vidLon = data.videoLocationLon || data.longitude;
                const audLat = data.audioLocationLat || data.latitude;
                const audLon = data.audioLocationLon || data.longitude;

                const cardHtml = `
                    <div class="report-card">
                        <div class="report-card-header">
                            <span class="badge badge-true">ID: ${data.trackingId || 'N/A'}</span>
                            <span style="font-size:11px;">${dateStr}</span>
                        </div>
                        <div class="report-location">📍 மாவட்டம்: ${data.district || 'N/A'} | ஸ்டேஷன்: ${data.policeStation || data.talukStation || 'N/A'}</div>
                        <div class="report-details"><b>விவரம்:</b> ${data.details || 'N/A'}</div>
                        
                        ${aiCardHtml}  
                        
                        <div class="status-box">
                            <b>📌 புகாரின் நிலை (Status Update):</b><br>
                            <select id="status_${docId}" style="margin: 5px 0; font-size: 12px; padding: 5px;">
                                <option value="Pending" ${currentStatus==='Pending'?'selected':''}>Pending (நிலுவையில்)</option>
                                <option value="In Progress" ${currentStatus==='In Progress'?'selected':''}>In Progress (விசாரணையில்)</option>
                                <option value="Action Taken" ${currentStatus==='Action Taken'?'selected':''}>Action Taken (நடவடிக்கை எடுக்கப்பட்டது)</option>
                                <option value="Resolved" ${currentStatus==='Resolved'?'selected':''}>Resolved / Closed (முடிவுற்றது)</option>
                            </select>
                            <textarea id="note_${docId}" placeholder="காவல்துறை அதிகாரி குறிப்பு..." style="font-size:12px; height:45px; margin-top:5px;">${data.officerNote || ''}</textarea>
                            <button onclick="updateReportStatus('${docId}')" style="background:#2e7d32; padding:6px; font-size:12px; margin-top:5px; width:auto;">💾 சேமி</button>
                        </div>

                        <div class="report-actions">
                            ${data.imageUrl ? `<button onclick="openMediaWindow('${data.imageUrl}', 'image')" class="action-btn btn-image">🔍 படம்</button>` : ''}
                            ${data.imageUrl && imgLat ? `<a href="https://www.google.com/maps?q=${imgLat},${imgLon}" target="_blank" class="action-btn btn-img-loc">📍 பட லொகேஷன்</a>` : ''}
                            
                            ${data.videoUrl ? `<button onclick="openMediaWindow('${data.videoUrl}', 'video')" class="action-btn btn-video">🎥 வீடியோ</button>` : ''}
                            ${data.videoUrl && vidLat ? `<a href="https://www.google.com/maps?q=${vidLat},${vidLon}" target="_blank" class="action-btn btn-vid-loc">📍 வீடியோ லொகேஷன்</a>` : ''}
                            
                            ${data.audioUrl ? `<button onclick="openMediaWindow('${data.audioUrl}', 'audio')" class="action-btn btn-voice">🔊 குரல்</button>` : ''}
                            ${data.audioUrl && audLat ? `<a href="https://www.google.com/maps?q=${audLat},${audLon}" target="_blank" class="action-btn btn-aud-loc">📍 குரல் லொகேஷன்</a>` : ''}
                            
                            ${data.latitude ? `<a href="https://www.google.com/maps?q=${data.latitude},${data.longitude}" target="_blank" class="action-btn btn-map">📍 நேரடி GPS மேப் பார்க்க</a>` : ''}
                        </div>
                    </div>
                `;
                gridContainer.innerHTML += cardHtml;
            });
        });
    }

    async function updateReportStatus(docId) {
        const newStatus = document.getElementById(`status_${docId}`).value;
        const newNote = document.getElementById(`note_${docId}`).value.trim();

        try {
            await db.collection("reports").doc(docId).update({
                complaintStatus: newStatus,
                officerNote: newNote
            });
            alert("✅ புகாரின் நிலை மாற்றப்பட்டது!");
        } catch (err) {
            alert("❌ பிழை: " + err.message);
        }
    }
</script>
