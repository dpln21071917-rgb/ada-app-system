    window.onload = function() {

        for (let dist in districtEnglishMap) {
            loginDistrictSelect.innerHTML += `<option value="${dist}">${dist} Control Room</option>`;

    function playPoliceEmergencyAlarm() {
        try {
            if (!alarmAudioContext) {
                alarmAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (alarmAudioContext.state === 'suspended') {
                alarmAudioContext.resume();
            }
            if (alarmInterval) clearInterval(alarmInterval);

            alarmInterval = setInterval(() => {
                let osc = alarmAudioContext.createOscillator();
                let gain = alarmAudioContext.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(850, alarmAudioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, alarmAudioContext.currentTime + 0.3);
                gain.gain.setValueAtTime(0.6, alarmAudioContext.currentTime);
                osc.connect(gain);
                gain.connect(alarmAudioContext.destination);
                osc.start();
                osc.stop(alarmAudioContext.currentTime + 0.3);
            }, 500);
        } catch (e) {
            console.log("Audio error:", e);
        }
    }

    function stopAlarmAndClosePopup() {
        if (alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
        document.getElementById('alertPopupOverlay').style.display = 'none';
    }

    function triggerNewComplaintAlert(data) {
        playPoliceEmergencyAlarm();
        const popupOverlay = document.getElementById('alertPopupOverlay');
        const popupText = document.getElementById('popupAlertText');
        popupText.innerHTML = `
            <b>ID:</b> ${data.trackingId || 'N/A'}<br>
            <b>மாவட்டம்:</b> ${data.district || 'N/A'}<br>
            <b>காவல் நிலையம்:</b> ${data.policeStation || data.taluk || 'N/A'}<br>
            <b>விவரம்:</b> ${data.details || 'N/A'}
        `;
        popupOverlay.style.display = 'flex';
    }

    function onLoginTypeChange() {
        const type = document.getElementById('loginType').value;
        const distWrapper = document.getElementById('districtSelectWrapper');
        const stationWrapper = document.getElementById('stationSelectWrapper');

        if (type === 'HQ') {
            distWrapper.style.display = 'none';
            stationWrapper.style.display = 'none';
        } else if (type === 'District') {
            distWrapper.style.display = 'block';
            stationWrapper.style.display = 'none';
        } else if (type === 'Station') {
            distWrapper.style.display = 'block';
            stationWrapper.style.display = 'block';
        }
    }

    async function onDistrictChange() {
        const selectedDistTa = document.getElementById('loginDistrict').value;
        const stationSelect = document.getElementById('loginStation');
        stationSelect.innerHTML = `<option value="">காவல் நிலையத்தைத் தேர்ந்தெடுக்கவும்...</option>`;
        if (!selectedDistTa) return;
        let distEng = districtEnglishMap[selectedDistTa] || selectedDistTa;

        try {
            let docSnap = await db.collection("admin_passwords").doc(distEng).get();
            if (!docSnap.exists) { 
                docSnap = await db.collection("admin_passwords").doc(distEng.toLowerCase()).get(); 
            }
            if (docSnap.exists && docSnap.data().stations) {
                docSnap.data().stations.forEach(station => {
                    stationSelect.innerHTML += `<option value="${station}">${station}</option>`;
                });
            }
        } catch (e) { 
            console.log("Station load error:", e); 
        }
    }

            }

            currentLoginType = "District";

                alert("⚠️ மாவட்டம் மற்றும் காவல் நிலையத்தை சரியாகத் தேர்ந்தெடுக்கவும்!");

    function openMediaWindow(dataUrl, type) {
        const win = window.open("", "_blank");
        if (type === 'image') { 
            win.document.write(`<img src="${dataUrl}" style="max-width:100%; height:auto;">`); 
        } else if (type === 'video') { 
            win.document.write(`<video controls src="${dataUrl}" style="max-width:100%; height:auto;" autoplay></video>`); 
        } else if (type === 'audio') { 
            win.document.write(`<audio controls src="${dataUrl}" autoplay></audio>`); 
        }
    }

    function evaluateComplaintDynamically(data) {
        let score = 0;
        let breakdown = [];

        // 1. GPS Check
        let lat = data.latitude || data.imageLocationLat || data.videoLocationLat || data.audioLocationLat;
        let lon = data.longitude || data.imageLocationLon || data.videoLocationLon || data.audioLocationLon;
        if (lat && lon) {
            score += 20;
            breakdown.push("✅ GPS லொகேஷன் அனுமதி உள்ளது (+20%)");
        } else {
            breakdown.push("❌ GPS லொகேஷன் அனுமதி இல்லை (0%)");
        }

        // 2. District / Station Check
        if (data.district || data.taluk || data.policeStation) {
            score += 20;
            breakdown.push("✅ மாவட்டம் & காவல் நிலையம் தேர்ந்தெடுக்கப்பட்டுள்ளது (+20%)");
        } else {
            breakdown.push("❌ மாவட்டம் / தாலுகா விடுபட்டுள்ளது (0%)");
        }

        // 3. Landmark / Text Details
        let txt = (data.details || "") + " " + (data.locationName || "");
        txt = txt.toLowerCase();
        if (txt.length >= 15) {
            score += 20;
            breakdown.push("✅ புகார் விவரங்கள் மற்றும் தெருவரிசை துல்லியமாக உள்ளன (+20%)");
        } else {
            breakdown.push("❌ புகார் விவரங்கள் போதிய அளவில் இல்லை (0%)");
        }

        // 4. Voice Audio Check
        let hasAudio = data.audioUrl || (data.audioUrls && data.audioUrls.length > 0);
        if (hasAudio) {
            score += 20;
            breakdown.push("✅ உண்மையான குரல் பதிவு இணைக்கப்பட்டுள்ளது (+20%)");
        } else {
            breakdown.push("❌ குரல் பதிவு இல்லை (0%)");
        }

        // 5. Image / Video Check
        let hasMedia = data.imageUrl || data.videoUrl || (data.imageUrls && data.imageUrls.length > 0) || (data.videoUrls && data.videoUrls.length > 0);
        if (hasMedia) {
            score += 20;
            breakdown.push("✅ புகைப்படங்கள் / வீடியோ ஆதாரங்கள் சேர்க்கப்பட்டுள்ளன (+20%)");
        } else {
            breakdown.push("❌ மீடியா ஆதாரங்கள் இல்லை (0%)");
        }

        let statusText = "FAKE";
        if (score >= 70) {
            statusText = "TRUE";
        } else if (score >= 40) {
            statusText = "SUSPICIOUS";
        }

        return { score: score, status: statusText, reasons: breakdown };
    }

    function monitorAdminReportsRealtime() {
        const gridContainer = document.getElementById('reportsGridContainer');
        const totalCountBadge = document.getElementById('totalReportsCount');
        
        db.collection("reports").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            let filteredDocs = [];
            
            // 🚨 புதிய புகார் வரும்போது அலாரம் ஒலிக்கும் லாஜிக் (Snapshot Changes)
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added" && !isInitialLoad) {
                    let newDocData = change.doc.data();
                    let docDistrict = (newDocData.district || "").trim();
                    let docStation = (newDocData.policeStation || newDocData.taluk || "").trim();

                    if (currentLoginType === "HQ" || 
                       (currentLoginType === "District" && docDistrict === currentLoginRole) || 
                       (currentLoginType === "Station" && docStation.includes(currentLoginRole))) {
                        triggerNewComplaintAlert(newDocData);
                    }
                }
            });

            isInitialLoad = false;

            snapshot.forEach(doc => {
                const data = doc.data();
                let docDistrict = (data.district || "").trim();
                let docStation = (data.policeStation || data.taluk || "").trim();

                if (currentLoginType === "HQ") {
                    filteredDocs.push({ id: doc.id, ...data });
                } else if (currentLoginType === "District") {
                    if (docDistrict === currentLoginRole) {
                        filteredDocs.push({ id: doc.id, ...data });
                    }
                } else if (currentLoginType === "Station") {
                    if (docStation.includes(currentLoginRole)) {
                        filteredDocs.push({ id: doc.id, ...data });
                    }
                }
            });

            totalCountBadge.innerText = `மொத்த புகார்கள்: ${filteredDocs.length}`;

            if (filteredDocs.length === 0) {
                gridContainer.innerHTML = `<div class="no-data">புதிய புகார்கள் எதுவும் இல்லை.</div>`;
                return;
            }

            gridContainer.innerHTML = "";
            filteredDocs.forEach(data => {
                const docId = data.id;
                let dateStr = "N/A";
                if (data.timestamp && data.timestamp.toDate) {
                    dateStr = data.timestamp.toDate().toLocaleString('ta-IN');
                }

                let currentStatus = data.complaintStatus || "Pending";
                
                // 🤖 துல்லியமான AI மதிப்பீடு (சுயமான கணக்கீடு - Dynamic Dynamic Evaluation)
                let evalResult = evaluateComplaintDynamically(data);
                
                let accuracyScore = data.aiScore !== undefined ? data.aiScore : (data.accuracyPercentage !== undefined ? data.accuracyPercentage : evalResult.score);
                let aiStatusText = data.aiStatus || data.aiAnalysis || evalResult.status;
                let breakdownReasons = (data.scoreBreakdown && data.scoreBreakdown.length > 0) ? data.scoreBreakdown : evalResult.reasons;
                
                let breakdownHtml = breakdownReasons.map(r => `<li>${r}</li>`).join('');
                let badgeColorClass = accuracyScore >= 70 ? 'badge-true' : (accuracyScore >= 40 ? 'badge-suspicious' : 'badge-fake');

                let aiCardHtml = `
                    <div class="ai-analysis-box">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <b>🤖 AI உண்மைத் தன்மை:</b>
                            <span class="badge ${badgeColorClass}" style="font-size: 11px; padding: 3px 8px;">${accuracyScore}% - ${aiStatusText}</span>
                        </div>
                        <div style="font-size: 11px; color: #555; margin-top: 4px;">
                            <b>பகுப்பாய்வு விவரம்:</b>
                            <ul style="margin: 3px 0 0 15px; padding: 0;">${breakdownHtml}</ul>
                        </div>
                    </div>
                `; 
                
                // 📍 அனைத்து மீடியாக்கள் மற்றும் அவற்றுக்கான பிரத்யேக லொகேஷன் மேப் பட்டன்கள்
                let mediaButtonsHtml = '';
                
                // 1. Images & Location Links
                let imgs = data.imageUrls || [];
                if (imgs.length > 0) {
                    imgs.forEach((img, i) => {
                        let imgUrl = typeof img === 'object' ? img.url : img;
                        let imgLat = typeof img === 'object' && img.location ? img.location.lat : null;
                        let imgLng = typeof img === 'object' && img.location ? img.location.lng : null;

                        mediaButtonsHtml += `<button onclick="openMediaWindow('${imgUrl}', 'image')" class="action-btn btn-image">🔍 படம் ${i+1}</button>`;
                        if (imgLat && imgLng) {
                            mediaButtonsHtml += `<a href="https://www.google.com/maps?q=${imgLat},${imgLng}" target="_blank" class="action-btn btn-map">📍 படம் ${i+1} Loc</a>`;
                        }
                    });
                } else if (data.imageUrl) {
                    mediaButtonsHtml += `<button onclick="openMediaWindow('${data.imageUrl}', 'image')" class="action-btn btn-image">🔍 படம்</button>`;
                }

                // 2. Videos & Location Links
                let vids = data.videoUrls || [];
                if (vids.length > 0) {
                    vids.forEach((vid, i) => {
                        let vidUrl = typeof vid === 'object' ? vid.url : vid;
                        let vidLat = typeof vid === 'object' && vid.location ? vid.location.lat : null;
                        let vidLng = typeof vid === 'object' && vid.location ? vid.location.lng : null;

                        mediaButtonsHtml += `<button onclick="openMediaWindow('${vidUrl}', 'video')" class="action-btn btn-video">🎥 வீடியோ ${i+1}</button>`;
                        if (vidLat && vidLng) {
                            mediaButtonsHtml += `<a href="https://www.google.com/maps?q=${vidLat},${vidLng}" target="_blank" class="action-btn btn-map">📍 வீடியோ ${i+1} Loc</a>`;
                        }
                    });
                } else if (data.videoUrl) {
                    mediaButtonsHtml += `<button onclick="openMediaWindow('${data.videoUrl}', 'video')" class="action-btn btn-video">🎥 வீடியோ</button>`;
                }

                // 3. Audio / Voice & Location Links
                let auds = data.audioUrls || [];
                if (auds.length > 0) {
                    auds.forEach((aud, i) => {
                        let audUrl = typeof aud === 'object' ? aud.url : aud;
                        let audLat = typeof aud === 'object' && aud.location ? aud.location.lat : null;
                        let audLng = typeof aud === 'object' && aud.location ? aud.location.lng : null;

                        mediaButtonsHtml += `<button onclick="openMediaWindow('${audUrl}', 'audio')" class="action-btn btn-voice">🔊 குரல் ${i+1}</button>`;
                        if (audLat && audLng) {
                            mediaButtonsHtml += `<a href="https://www.google.com/maps?q=${audLat},${audLng}" target="_blank" class="action-btn btn-map">📍 குரல் ${i+1} Loc</a>`;
                        }
                    });
                } else if (data.audioUrl) {
                    mediaButtonsHtml += `<button onclick="openMediaWindow('${data.audioUrl}', 'audio')" class="action-btn btn-voice">🔊 குரல்</button>`;
                }

                // General GPS fallback link
                let lat = data.latitude || data.imageLocationLat || data.videoLocationLat || data.audioLocationLat;
                let lon = data.longitude || data.imageLocationLon || data.videoLocationLon || data.audioLocationLon;

                if (lat && lon && !mediaButtonsHtml.includes('maps?q=')) {
                    mediaButtonsHtml += `<a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" class="action-btn btn-map" style="grid-column: span 2;">📍 நேரடி GPS மேப் பார்க்க</a>`;
                }
                
                const cardHtml = `
                    <div class="report-card">
                        <div class="report-card-header">
                            <span class="badge badge-true">ID: ${data.trackingId || 'N/A'}</span>
                            <span style="font-size:11px;">${dateStr}</span>
                        </div>
                        <div class="report-location">📍 மாவட்டம்: ${data.district || 'N/A'} | ஸ்டேஷன்: ${data.policeStation || data.taluk || 'N/A'}</div>
                        <div class="report-details"><b>இடம்/தெரு:</b> ${data.locationName || 'N/A'}<br><b>விவரம்:</b> ${data.details || 'N/A'}</div>
                        
                        ${aiCardHtml}  
                        
                        <div class="status-box">
                            <b>📌 புகாரின் நிலை (Status Update):</b><br>
                            <select id="status_${docId}" style="margin: 5px 0; font-size: 12px; padding: 5px;">
                                <option value="Pending" ${currentStatus==='Pending'?'selected':''}>Pending (நிலுவையில்)</option>
                                <option value="In Progress" ${currentStatus==='In Progress'?'selected':''}>In Progress (விசாரணையில்)</option>
                                <option value="Action Taken" ${currentStatus==='Action Taken'?'selected':''}>Action Taken (நடவடிக்கை எடுக்கப்பட்டது)</option>
                                <option value="Resolved" ${currentStatus==='Resolved'?'selected':''}>Resolved / Closed (முடிவுற்றது)</option>
                            </select>
                            <textarea id="note_${docId}" placeholder="காவல்துறை அதிகாரி குறிப்பு..." style="font-size:12px; height:45px; margin-top:5px;">${data.officerNote || ''}</textarea>
                            <button onclick="updateReportStatus('${docId}')" style="background:#2e7d32; padding:6px; font-size:12px; margin-top:5px; width:auto;">💾 சேமி</button>
                        </div>

                        <div class="report-actions">
                            ${mediaButtonsHtml}
                        </div>
                    </div>
                `;
                gridContainer.innerHTML += cardHtml;
            });
        });
    }

    async function updateReportStatus(docId) {
        const newStatus = document.getElementById(`status_${docId}`).value;
        const newNote = document.getElementById(`note_${docId}`).value.trim();
        try {
            await db.collection("reports").doc(docId).update({ complaintStatus: newStatus, officerNote: newNote });
            alert("✅ புகாரின் நிலை மாற்றப்பட்டது!");
        } catch (err) { 
            alert("❌ பிழை: " + err.message); 
        }
    }
</script>
