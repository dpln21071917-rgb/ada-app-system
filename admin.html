    <link rel="icon" href="admin-logo.png" type="image/png">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
        .admin-container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-card { max-width: 420px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }

        .admin-logo-img {
            width: 110px; height: 110px; object-fit: cover; border-radius: 50%;
            border: 3px solid #1e3c72; background-color: #fff; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);

        h2 { color: #1e3c72; margin-bottom: 5px; text-align: center; font-size: 22px; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; text-align: center; }
        select, input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 14px; }

        button:hover { background-color: #152a4f; }
        .form-label { text-align: left; font-size: 13px; font-weight: bold; color: #555; margin-top: 5px; display: block; }

        .admin-header-bar { background: #1e3c72; color: white; padding: 15px 20px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .dashboard-logo {
            width: 50px; height: 50px; object-fit: cover; border-radius: 50%;
            border: 2px solid white; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .reports-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; margin-top: 15px; max-height: 75vh; overflow-y: auto; padding-right: 5px; }
        .report-card { background: #fff; border: 1px solid #ddd; border-left: 5px solid #1e3c72; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; }
        .report-card.new-card { border-left-color: #c9302c; background: #fff5f5; box-shadow: 0 0 0 2px rgba(201,48,44,0.35); }
        .report-card-header { display: flex; justify-content: space-between; font-size: 12px; color: #777; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 5px; align-items: center; }
        .report-location { font-weight: bold; color: #333; font-size: 13px; margin-bottom: 6px; }
        .report-details { font-size: 13px; color: #555; background: #f9f9f9; padding: 8px; border-radius: 4px; margin-bottom: 10px; word-break: break-word; }
        .ai-analysis-box { background: #f0f4f8; border-left: 4px solid #337ab7; padding: 10px; font-size: 12px; margin-bottom: 10px; border-radius: 6px; color: #333; }
        .evidence-box { background: #fafafa; border: 1px solid #e0e0e0; border-left: 4px solid #8e44ad; padding: 8px 10px; font-size: 11.5px; margin-bottom: 10px; border-radius: 6px; color: #333; }
        .ev-row { padding: 5px 0; border-bottom: 1px dashed #ddd; line-height: 1.5; word-break: break-word; }
        .ev-row:last-child { border-bottom: none; }
        .err-box { background: #fdecea; border: 1px solid #f5c2c0; color: #a02622; padding: 8px 10px; font-size: 11px; margin-bottom: 10px; border-radius: 6px; word-break: break-word; }
        .status-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }

        .report-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .action-btn { flex: 1; min-width: 90px; padding: 8px; font-size: 11px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; color: white; }
        .btn-image { background-color: #337ab7; }
        .btn-video { background-color: #8e44ad; }
        .btn-voice { background-color: #2e7d32; }
        .btn-map { background-color: #f0ad4e; color: #333; }
        .btn-delete { background-color: #c9302c; width: 100%; margin-top: 8px; padding: 6px; font-size: 11px; }

        .no-data { text-align: center; color: #777; padding: 40px; grid-column: 1 / -1; font-size: 15px; }
        .badge { background: #1e3c72; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .badge-true { background: #2e7d32; }
        .badge-fake { background: #c9302c; }
        .badge-suspicious { background: #f0ad4e; color: #333; }

        .whatsapp-badge {
            background-color: #25d366; color: white; border-radius: 50%;
            padding: 2px 8px; font-size: 12px; font-weight: bold;
            display: inline-block; margin-left: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            animation: pulse-badge 1.5s infinite;
        }
        @keyframes pulse-badge { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

        .alert-popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; padding: 15px; }
        .alert-popup-card { background: white; padding: 25px; border-radius: 12px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 4px 25px rgba(30,60,114,0.5); border: 3px solid #1e3c72; max-height: 90vh; overflow-y: auto; }
        .alert-item { text-align: left; font-size: 14px; color: #333; line-height: 1.5; padding: 8px 0; border-bottom: 1px dashed #ccc; word-break: break-word; }
        .alert-item:last-child { border-bottom: none; }

        .header-btn { padding: 6px 12px; border-radius: 4px; font-size: 12px; width: auto; margin-top: 0; cursor: pointer; color: white; }
        .live-status { font-size: 12px; font-weight: bold; padding: 6px 10px; border-radius: 4px; background: #eef3fb; color: #1e3c72; }
        #loadMoreWrap { text-align: center; display: none; }
        #loadMoreBtn { width: auto; padding: 10px 24px; background: #337ab7; }
    </style>
</head>

        <div id="popupCountLine" style="font-size: 13px; color: #c9302c; font-weight: bold; margin-bottom: 8px;"></div>

</div>

<div class="login-card" id="adminLoginCard">
    <img src="admin-logo.png" alt="ADA ADMIN Logo" class="admin-logo-img" onerror="this.src='icon-192.png'">

    <h2>👮 Police Command Panel</h2>
    <div class="subtitle">அதிகாரபூர்வ கணக்குடன் மட்டும் உள்நுழையவும்</div>

</div>

        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="admin-logo.png" alt="Logo" class="dashboard-logo" onerror="this.src='icon-192.png'">
            <div>
                <span id="adminPanelTitle" style="font-size: 18px; font-weight: bold; display:inline-block;">🚨 Police Admin Panel</span>
                <span id="whatsappUnreadBadge" class="whatsapp-badge" style="display:none;">0</span>
                <div id="adminSubTitle" style="font-size: 12px; color: #d0e1fd; margin-top: 2px;">மேற்பார்வை பலகை</div>
            </div>
        </div>
        <span id="totalReportsCount" style="background: white; color: #1e3c72; padding: 6px 14px; border-radius: 4px; font-size: 14px; font-weight: bold;">மொத்த புகார்கள்: 0</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #666; flex-wrap: wrap;">
            <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAllReports(this)" style="width: 18px; height: 18px; cursor: pointer; margin: 0;">
            <label for="selectAllCheckbox" style="cursor: pointer; font-weight: bold; color: #1e3c72;">அனைத்தையும் தேர்ந்தெடு (Select All)</label>
            <span id="liveStatus" class="live-status">⏳ இணைக்கிறது...</span>

        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="header-btn" onclick="enableAlerts()" style="background: #f0ad4e; color: #333;">🔔 Alerts இயக்கு / சோதனை</button>
            <button class="header-btn" onclick="monitorAdminReportsRealtime()" style="background: #2e7d32;">🔄 புதுப்பி (Refresh)</button>
            <button class="header-btn hq-only" onclick="deleteSelectedReports()" style="background: #d9534f; display: none;">🗑️ தேர்ந்தெடுக்கப்பட்டதை நீக்கு (HQ)</button>
            <button class="header-btn" onclick="logoutAdmin()" style="background: #555;">🚪 வெளியேறு (Logout)</button>
        </div>
    </div>

    <div class="reports-grid" id="reportsGridContainer">
        <div class="no-data">தரவுகள் ஏற்றப்படுகின்றன...</div>

    <div id="loadMoreWrap"><button id="loadMoreBtn" onclick="loadMoreReports()">⬇️ மேலும் ஏற்று</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

<script>
    const districtEnglishMap = {
        "சென்னை": "Chennai", "செங்கல்பட்டு": "Chengalpattu", "காஞ்சிபுரம்": "Kanchipuram",
        "திருவள்ளூர்": "Thiruvallur", "வேலூர்": "Vellore", "ராணிப்பேட்டை": "Ranipet",
        "திருப்பத்தூர்": "Tirupattur", "திருவண்ணாமலை": "Thiruvannamalai", "விழுப்புரம்": "Villupuram",
        "கள்ளக்குறிச்சி": "Kallakurichi", "கடலூர்": "Cuddalore", "தர்மபுரி": "Dharmapuri",
        "கிருஷ்ணகிரி": "Krishnagiri", "சேலம்": "Salem", "நாமக்கல்": "Namakkal",
        "ஈரோடு": "Erode", "திருப்பூர்": "Tiruppur", "கோயம்புத்தூர்": "Coimbatore",
        "நீலகிரி": "Nilgiris", "கரூர்": "Karur", "திருச்சிராப்பள்ளி": "Trichy",
        "பெரம்பலூர்": "Perambalur", "அரியலூர்": "Ariyalur", "தஞ்சாவூர்": "Thanjavur",
        "திருவாரூர்": "Thiruvarur", "நாகப்பட்டினம்": "Nagapattinam", "மயிலாடுதுறை": "Mayiladuthurai",
        "புதுக்கோட்டை": "Pudukottai", "சிவகங்கை": "Sivagangai", "மதுரை": "Madurai",
        "தேனி": "Theni", "திண்டுக்கல்": "Dindigul", "இராமநாதபுரம்": "Ramanathapuram",
        "விருதுநகர்": "Virudhunagar", "தூத்துக்குடி": "Thoothukudi", "திருநெல்வேலி": "Tirunelveli",
        "தென்காசி": "Tenkasi", "கன்னியாகுமரி": "Kanyakumari"
    };

    const firebaseConfig = {
        apiKey: "AIzaSyBeTwiRPYZCMru4e2dDfey9_-7OUJ-fYTE",
        authDomain: "people-safety-b341b.firebaseapp.com",
        projectId: "people-safety-b341b",
        storageBucket: "people-safety-b341b.firebasestorage.app",
        messagingSenderId: "72711788900",
        appId: "1:72711788900:web:3aa7c75ce29e8d0ad18271",
        measurementId: "G-P5F626HXXJ"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    // Firebase console → App Check → reCAPTCHA v3 key உருவாக்கி இங்கு இடவும் (காலியாக இருந்தால் App Check இயங்காது)
    const APPCHECK_SITE_KEY = "";
    if (APPCHECK_SITE_KEY) {
        try { firebase.appCheck().activate(APPCHECK_SITE_KEY, true); } catch (e) { console.warn("App Check activate failed:", e); }
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ---------- நிலை மாறிகள் ----------
    const PAGE_SIZE = 20;
    let currentLoginRole = "";
    let currentLoginType = "";
    let currentDistrictTa = "";
    let selectedDistrictEng = "";
    let reportsUnsubscribe = null;

    let alarmAudioContext = null;
    let sirenOsc = null, sirenGain = null, sirenRefresh = null, sirenEnd = 0;
    let titleBlink = null;
    let unreadCount = 0;
    let pendingAlerts = [];

    const docsMap = new Map();     // id -> data
    const cardEls = new Map();     // id -> DOM element
    const dirtyIds = new Set();    // மாறிய புகார்கள் (card மீண்டும் வரையப்படும்)
    const alertedIds = new Set();  // ஏற்கனவே alert அடித்தவை
    const newIds = new Set();      // படிக்காத புதிய புகார்கள்
    let visibleCount = PAGE_SIZE;
    let renderTimer = null;

    // ---------- பாதுகாப்பு உதவி ----------
    function esc(s) {
        return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    window.onload = function() {
        // பக்கத்தில் எங்கு click/touch செய்தாலும் ஒலி unlock ஆகும்
        ['click', 'keydown', 'touchstart'].forEach(ev =>
            document.addEventListener(ev, () => ensureAudio(), { passive: true })
        );

        // card பொத்தான்களுக்கான event delegation
        document.getElementById('reportsGridContainer').addEventListener('click', onGridClick);

        startAuthWatcher();
    };

    // ---------- 🔊 அலாரம் ----------
    function ensureAudio() {
        try {
            if (!alarmAudioContext) {
                alarmAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (alarmAudioContext.state === 'suspended') {
                alarmAudioContext.resume();
            }
        } catch (e) { console.log("Audio error:", e); }
    }

    function scheduleSiren(startTime, cycles) {
        for (let i = 0; i < cycles; i++) {
            const t = startTime + i * 0.8;
            sirenOsc.frequency.setValueAtTime(600, t);
            sirenOsc.frequency.linearRampToValueAtTime(1000, t + 0.4);
            sirenOsc.frequency.linearRampToValueAtTime(600, t + 0.8);
        }
        sirenEnd = startTime + cycles * 0.8;
    }

    // ஒரே தொடர் siren: audio clock-ல் முன்கூட்டியே திட்டமிடப்படுவதால் background tab-லும் தாமதம் இல்லை
    function playPoliceEmergencyAlarm() {
        try {
            ensureAudio();
            if (sirenOsc) return; // ஏற்கனவே ஒலிக்கிறது
            const ctx = alarmAudioContext;
            sirenOsc = ctx.createOscillator();
            sirenGain = ctx.createGain();
            sirenOsc.type = 'sawtooth';
            sirenGain.gain.value = 0.5;
            sirenOsc.connect(sirenGain);
            sirenGain.connect(ctx.destination);
            scheduleSiren(ctx.currentTime, 40);
            sirenOsc.start();
            sirenRefresh = setInterval(() => {
                if (sirenOsc && (sirenEnd - ctx.currentTime) < 15) scheduleSiren(sirenEnd, 40);
            }, 5000);
        } catch (e) { console.log("Alarm error:", e); }
    }

    function stopSiren() {
        if (sirenRefresh) { clearInterval(sirenRefresh); sirenRefresh = null; }
        try { if (sirenOsc) { sirenOsc.stop(); sirenOsc.disconnect(); } } catch (e) {}
        try { if (sirenGain) sirenGain.disconnect(); } catch (e) {}
        sirenOsc = null; sirenGain = null;
    }

    function enableAlerts() {
        ensureAudio();
        if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
        try { // சிறிய சோதனை ஒலி
            const ctx = alarmAudioContext;
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.3;
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime + 0.4);
        } catch (e) {}
        alert("✅ Alerts இயக்கப்பட்டது. சோதனை ஒலி கேட்டதா?");
    }

    function startTitleBlink() {
        if (titleBlink) return;
        let on = false;
        titleBlink = setInterval(() => {
            on = !on;
            document.title = on ? `(${unreadCount}) 🚨 புதிய புகார்` : "Police Command Panel";
        }, 1000);
    }

    function stopAlarmAndClosePopup() {
        stopSiren();
        if (titleBlink) { clearInterval(titleBlink); titleBlink = null; }
        const popupOverlay = document.getElementById('alertPopupOverlay');
        if (popupOverlay) popupOverlay.style.display = 'none';
        unreadCount = 0;
        pendingAlerts = [];
        document.title = "Police Command Panel";
        updateWhatsAppBadge();

        // புதிய புகார்களின் highlight நீக்கம்
        newIds.forEach(id => { const el = cardEls.get(id); if (el) el.classList.remove('new-card'); });
        newIds.clear();
        const grid = document.getElementById('reportsGridContainer');
        if (grid) grid.scrollTop = 0;
    }

    function updateWhatsAppBadge() {
        const badge = document.getElementById('whatsappUnreadBadge');
        if (!badge) return;
        if (unreadCount > 0) {
            badge.innerText = unreadCount;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
    }

    // 🚨 முதலில் alert — பட்டியல் வரைவது அதன் பிறகுதான்
    function triggerNewComplaintAlert(data) {
        unreadCount++;
        pendingAlerts.unshift(data);
        if (pendingAlerts.length > 5) pendingAlerts.pop();

        playPoliceEmergencyAlarm();
        updateWhatsAppBadge();
        document.title = `(${unreadCount}) 🚨 புதிய புகார்`;
        startTitleBlink();

        const popupText = document.getElementById('popupAlertText');
        const countLine = document.getElementById('popupCountLine');
        if (popupText) {
            popupText.innerHTML = pendingAlerts.map(d => `
                <div class="alert-item">
                    <b>ID:</b> ${esc(d.trackingId || 'N/A')}<br>
                    <b>மாவட்டம்:</b> ${esc(d.district || 'N/A')}<br>
                    <b>காவல் நிலையம்:</b> ${esc(d.policeStation || d.taluk || 'N/A')}<br>
                    <b>விவரம்:</b> ${esc(d.details || 'N/A')}
                </div>`).join('');
        }
        if (countLine) countLine.innerText = unreadCount > 1 ? `படிக்காத புதிய புகார்கள்: ${unreadCount}` : '';

        const popupOverlay = document.getElementById('alertPopupOverlay');
        if (popupOverlay) popupOverlay.style.display = 'flex';

        const warn = document.getElementById('popupSoundWarn');
        if (warn) warn.style.display = (alarmAudioContext && alarmAudioContext.state === 'running') ? 'none' : 'block';

        try {
            if ("Notification" in window && Notification.permission === "granted") {
                const n = new Notification("🚨 புதிய புகார்", {
                    body: data.details || "புதிய புகார் பெறப்பட்டது",
                    requireInteraction: true
                });
                n.onclick = () => { window.focus(); n.close(); };
            }
        } catch (e) {}
    }

    // ---------- 🔐 உள்நுழைவு (Firebase Authentication) ----------
    // கடவுச்சொல் இனி இந்தக் கோப்பில் இல்லை. பங்கு (role) சர்வரில் உள்ள admins/{uid} ஆவணத்திலிருந்து வருகிறது.
    let adminProfile = { uid: '', email: '', role: '', district: '', station: '' };
    let dashboardStarted = false;
    const isHQ = () => adminProfile.role === 'HQ';

    function loginMsg(t) { const el = document.getElementById('loginMsg'); if (el) el.innerText = t || ''; }

    function showLoginScreen() {
        if (reportsUnsubscribe) { reportsUnsubscribe(); reportsUnsubscribe = null; }
        dashboardStarted = false;
        adminProfile = { uid: '', email: '', role: '', district: '', station: '' };
        document.getElementById('adminContainer').style.display = 'none';
        document.getElementById('adminLoginCard').style.display = 'block';
    }

    function startAuthWatcher() {
        auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(() => {});
        auth.onAuthStateChanged(async (user) => {
            if (!user || user.isAnonymous) { showLoginScreen(); return; }
            if (dashboardStarted && adminProfile.uid === user.uid) return;
            try {
                const snap = await db.collection('admins').doc(user.uid).get();
                if (!snap.exists) {
                    loginMsg('❌ இந்தக் கணக்குக்கு அணுகல் வழங்கப்படவில்லை.');
                    await auth.signOut();
                    return;
                }
                const p = snap.data() || {};
                let title, sub;
                if (p.role === 'HQ') {
                    currentLoginType = 'HQ'; currentLoginRole = 'HQ'; currentDistrictTa = '';
                    title = '🚨 தமிழ்நாடு காவல்துறை - தலைமையகம் (HQ)';
                    sub = 'மாநிலம் முழுவதிலும் இருந்து பெறப்பட்ட அனைத்து மாவட்டப் புகார்களும் காட்டப்படுகின்றன.';
                } else if (p.role === 'District' && p.district) {
                    currentLoginType = 'District'; currentLoginRole = p.district; currentDistrictTa = p.district;
                    title = `🚨 ${p.district} மாவட்ட கட்டுப்பாட்டு அறை`;
                    sub = `${p.district} மாவட்ட எல்லைக்குட்பட்ட புகார்கள் மட்டும் காட்டப்படுகின்றன.`;
                } else if (p.role === 'Station' && p.district && p.station) {
                    currentLoginType = 'Station'; currentLoginRole = p.station; currentDistrictTa = p.district;
                    title = `🚨 ${p.station} காவல் நிலையம்`;
                    sub = `${p.station} எல்லைக்குட்பட்ட புகார்கள் மட்டும் காட்டப்படுகின்றன.`;
                } else {
                    loginMsg('❌ கணக்கு அமைப்பு சரியில்லை (role). நிர்வாகியைத் தொடர்பு கொள்ளவும்.');
                    await auth.signOut();
                    return;
                }
                adminProfile = { uid: user.uid, email: user.email || '', role: p.role, district: p.district || '', station: p.station || '' };
                document.querySelectorAll('.hq-only').forEach(el => { el.style.display = isHQ() ? 'inline-block' : 'none'; });
                dashboardStarted = true;
                loginMsg('');
                initDashboard(title, sub + ' (' + (user.email || '') + ')');
            } catch (e) {
                console.error("Admin profile load failed:", e);
                loginMsg('❌ கணக்கைச் சரிபார்க்க முடியவில்லை: ' + (e && e.code === 'permission-denied' ? 'அனுமதி மறுக்கப்பட்டது' : 'இணைப்புப் பிழை'));
                try { await auth.signOut(); } catch (e2) {}
            }
        });
    }

    async function adminLogin() {
        const email = (document.getElementById('loginEmail').value || '').trim();
        const pw = document.getElementById('loginPassword').value || '';
        if (!email || !pw) { loginMsg('⚠️ மின்னஞ்சல் மற்றும் கடவுச்சொல்லை உள்ளிடவும்.'); return; }
        loginMsg('');
        if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
        ensureAudio();   // Login click ஒரு user gesture — இங்கேயே ஒலியை unlock செய்கிறோம்
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        try {
            await auth.signInWithEmailAndPassword(email, pw);
        } catch (e) {
            const c = (e && e.code) || '';
            if (c === 'auth/too-many-requests') loginMsg('⚠️ பல முறை தவறாக முயன்றதால் தற்காலிகமாகத் தடுக்கப்பட்டுள்ளது. சிறிது நேரம் கழித்து முயலவும்.');
            else if (c === 'auth/network-request-failed') loginMsg('⚠️ இணைய இணைப்பைச் சரிபார்க்கவும்.');
            else loginMsg('❌ மின்னஞ்சல் அல்லது கடவுச்சொல் தவறு.');
        } finally {
            btn.disabled = false;
            document.getElementById('loginPassword').value = '';
        }
    }

    async function adminForgotPassword() {
        const email = (document.getElementById('loginEmail').value || '').trim();
        if (!email) { loginMsg('⚠️ முதலில் உங்கள் மின்னஞ்சலை உள்ளிடவும்.'); return; }
        try { await auth.sendPasswordResetEmail(email); } catch (e) { /* கணக்கு உள்ளதா இல்லையா என்பதை வெளிப்படுத்தாமல் இருக்க */ }
        loginMsg('ℹ️ அந்த மின்னஞ்சல் பதிவில் இருந்தால், கடவுச்சொல் மீட்பு இணைப்பு அனுப்பப்படும்.');
    }

    async function logoutAdmin() {
        if (reportsUnsubscribe) { reportsUnsubscribe(); reportsUnsubscribe = null; }
        stopAlarmAndClosePopup();
        try { await auth.signOut(); } catch (e) {}
        location.reload();
    }

    function initDashboard(titleText, subtitleText) {
        const loginCard = document.getElementById('adminLoginCard');
        const adminContainer = document.getElementById('adminContainer');
        const panelTitle = document.getElementById('adminPanelTitle');
        const subTitle = document.getElementById('adminSubTitle');

        if (loginCard) loginCard.style.display = 'none';
        if (adminContainer) adminContainer.style.display = 'block';
        if (panelTitle) panelTitle.innerText = titleText;

        monitorAdminReportsRealtime();

    // ---------- 🔗 பாதுகாப்பான ஊடக இணைப்பு ----------
    // புகார்தாரர் அனுப்பும் இணைப்புகளில் நம்பகமான Cloudinary முகவரிகள் (அல்லது பழைய data: படங்கள்) மட்டுமே திறக்கப்படும்
    function isSafeMediaUrl(u) {
        try {
            const x = new URL(String(u));
            if (x.protocol === 'https:') return x.hostname === 'res.cloudinary.com';
            if (x.protocol === 'data:') return /^data:(image|video|audio)\//.test(String(u));
        } catch (e) {}
        return false;
    }

    function openMediaWindow(url, type) {
        if (!isSafeMediaUrl(url)) { alert("⚠️ பாதுகாப்பற்ற இணைப்பு தடுக்கப்பட்டது."); return; }
        const win = window.open("", "_blank");
        if (!win) { alert("⚠️ Pop-up தடுக்கப்பட்டுள்ளது. Browser-ல் அனுமதிக்கவும்."); return; }
        try { win.opener = null; } catch (e) {}
        const tag = type === 'image' ? 'img' : (type === 'video' ? 'video' : 'audio');
        const el = win.document.createElement(tag);
        el.src = url;
        el.style.maxWidth = '100%';
        el.style.height = 'auto';
        if (tag !== 'img') { el.controls = true; el.autoplay = true; }
        win.document.body.appendChild(el);
    }

    // 🤖 AI நர்கோடிக்ஸ் ஸ்கேனர் (மாற்றம் இல்லை)
    function evaluateNarcoticsAI(data) {
        let score = 0;
        let breakdown = [];

        let mainLat = data.latitude;
        let mainLon = data.longitude;
        if (mainLat && mainLon) {
            score += 20;
            breakdown.push(`✅ மெயின் லொகேஷன் அனுமதி பெற்றுள்ளது (+20 Marks)`);
        } else {
            breakdown.push(`❌ மெயின் லொகேஷன் இல்லை (0 Marks)`);
        }

        if (data.district || data.policeStation || data.taluk) {
            score += 10;
            breakdown.push(`✅ மாவட்டம் & காவல் நிலையம் உறுதி (+10 Marks)`);
        } else {
            breakdown.push(`❌ காவல் நிலைய விவரங்கள் இல்லை (0 Marks)`);
        }

        let detailsText = (data.details || "").toLowerCase();
        const drugKeywords = [
            "ganja", "கஞ்சா", "weed", "மரிஜுவானா", "marijuana", "opium", "அபின்",
            "heroin", "ஹெராயின்", "cocaine", "கோகைன்", "crack", "கிராக்", "meth", "மெத்",
            "amphetamine", "மெத்தாம்பெட்டமைன்", "lsd", "சாராயம்", "kalla sarayam",
            "கள்ள சாராயம்", "குட்கா", "gutka", "ஹான்ஸ்", "hans", "பான்மசாலா", "pan masala",
            "Tobacco", "புகையிலை", "nicotine", "கேட்டமைன்", "ketamine", "ghb", "mdma",
            "எக்ஸ்டசி", "ecstasy", "morphine", "மார்பின்", "codeine", "கோடீன்", "hashish",
            "ஹாஷிஷ்", "charas", "சரஸ்", "bhang", "பாங்", "pothai", "போதை", "drugs", "selling", "vikkirathu"
        ];

        let matchedWordsCount = 0;
        drugKeywords.forEach(kw => {
            if (detailsText.includes(kw)) matchedWordsCount++;
        });

        let textScore = 0;
        if (matchedWordsCount > 0) {
            textScore = Math.min(30, matchedWordsCount * 10);
            breakdown.push(`✅ உரை பகுப்பாய்வு: உண்மையான போதை வார்த்தைகள் கண்டறியப்பட்டது (${matchedWordsCount} keywords) (+${textScore} Marks)`);
        } else {
            textScore = 0;
            breakdown.push(`❌ உரை விவரங்களில் போதைப்பொருள் பெயர்கள் எதுவும் இல்லை (0 Marks)`);
        }
        score += textScore;

        let auds = data.audioUrls || [];
        let hasSingleAudio = data.audioUrl;
        let audioScore = 0;

        if (auds.length > 0 || hasSingleAudio) {
            audioScore = 20;
            breakdown.push(`✅ உண்மையான வாய்ஸ் ரெக்கார்டிங் இணைக்கப்பட்டுள்ளது (+20 Marks)`);
        } else {
            breakdown.push(`❌ வாய்ஸ் ரெக்கார்டிங் இல்லை (0 Marks)`);
        }
        score += audioScore;

        let imgs = data.imageUrls || [];
        let vids = data.videoUrls || [];
        let mediaScore = 0;

        if (imgs.length > 0 || data.imageUrl) {
            mediaScore += 10;
            breakdown.push(`✅ புகைப்படம் இணைக்கப்பட்டுள்ளது (+10 Marks)`);
        } else {
            breakdown.push(`❌ புகைப்படம் இல்லை (0 Marks)`);
        }

        if (vids.length > 0 || data.videoUrl) {
            mediaScore += 10;
            breakdown.push(`✅ வீடியோ இணைக்கப்பட்டுள்ளது (+10 Marks)`);
        } else {
            breakdown.push(`❌ வீடியோ இல்லை (0 Marks)`);
        }
        score += mediaScore;

        let finalScore = Math.min(100, score);
        let statusText = "";

        if (matchedWordsCount === 0 || finalScore < 50) {
            finalScore = Math.min(finalScore, 40);
            statusText = "SUSPICIOUS / பரிசீலனையில் (போதை வார்த்தைகள் இல்லை)";
        } else {
            statusText = "TRUE (உண்மையானது)";
        }

        return { score: finalScore, status: statusText, reasons: breakdown, mainLat: mainLat, mainLon: mainLon };
    }

    // ---------- வடிகட்டி ----------
    function matchesFilter(data) {
        const docDistrict = (data.district || "").trim();
        const docStation = (data.policeStation || data.taluk || "").trim();
        if (currentLoginType === "HQ") return true;
        if (currentLoginType === "District") return docDistrict === currentLoginRole;
        if (currentLoginType === "Station") return docDistrict === currentDistrictTa && docStation.includes(currentLoginRole);
        return false;
    }

    function tsMillis(d) {
        if (d.timestamp && d.timestamp.toMillis) return d.timestamp.toMillis();
        return Number.MAX_SAFE_INTEGER; // சர்வர் நேரம் இன்னும் வராத புதிய புகார் → மேலே
    }

    function setLiveStatus(fromCache) {
        const el = document.getElementById('liveStatus');
        if (!el) return;
        if (fromCache) {
            el.innerText = "🟠 இணைப்பு காத்திருக்கிறது...";
            el.style.background = "#fff3cd"; el.style.color = "#8a6d3b";
        } else {
            el.innerText = "🟢 நேரலை (Live)";
            el.style.background = "#e3f4e6"; el.style.color = "#2e7d32";
        }
    }

    // ⚡ நேரலை கண்காணிப்பு: alert உடனே, பட்டியல் பின்னர், புதிய/மாறிய புகார்கள் மட்டும் வரையப்படும்
    function monitorAdminReportsRealtime() {
        const gridContainer = document.getElementById('reportsGridContainer');
        const totalCountBadge = document.getElementById('totalReportsCount');
        if (!gridContainer || !totalCountBadge) return;
        if (reportsUnsubscribe) { reportsUnsubscribe(); reportsUnsubscribe = null; }

        docsMap.clear(); cardEls.clear(); dirtyIds.clear(); alertedIds.clear(); newIds.clear();
        visibleCount = PAGE_SIZE;
        gridContainer.innerHTML = `<div class="no-data">தரவுகள் ஏற்றப்படுகின்றன...</div>`;
        setLiveStatus(true);

        let firstLoad = true; // முதல் முறை வரும் பழைய புகார்களுக்கு alarm இல்லை

        // மாவட்டம்/காவல் நிலைய admin-க்கு அவர்கள் மாவட்டம் மட்டும் server-லேயே வடிகட்டப்படும்
        let q = db.collection("reports");
        if (currentLoginType !== "HQ") q = q.where("district", "==", currentDistrictTa);
        if (currentLoginType === "Station") q = q.where("taluk", "==", currentLoginRole);

        reportsUnsubscribe = q.onSnapshot((snapshot) => {
            const freshOnes = [];

            snapshot.docChanges().forEach((change) => {
                const id = change.doc.id;
                if (change.type === "removed") {
                    docsMap.delete(id); cardEls.delete(id); newIds.delete(id);
                    return;
                }
                const data = Object.assign({ id: id }, change.doc.data({ serverTimestamps: 'estimate' }));
                if (!matchesFilter(data)) { docsMap.delete(id); cardEls.delete(id); return; }

                docsMap.set(id, data);
                dirtyIds.add(id);

                if (change.type === "added" && !firstLoad && !alertedIds.has(id)) {
                    alertedIds.add(id);
                    freshOnes.push(data);
                }
            });
            const wasFirst = firstLoad;
            firstLoad = false;

            // 1) அலாரம் + pop-up + unread badge — உடனடியாக
            freshOnes.forEach(d => { newIds.add(d.id); triggerNewComplaintAlert(d); });

            // 2) பட்டியல் வரைவு — சிறிய தாமதத்துடன் (alert-ஐ தடுக்காது)
            scheduleRender();
            setLiveStatus(snapshot.metadata.fromCache);
            if (wasFirst) alertedIds.clear();
        }, (err) => {
            console.error("Snapshot error:", err);
            setLiveStatus(true);
            gridContainer.innerHTML = `<div class="no-data" style="color:red;">பிழை: ${esc(err.message)}</div>`;
        });
    }

    function scheduleRender() {
        if (renderTimer) return;
        renderTimer = setTimeout(() => { renderTimer = null; renderReports(); }, 30);
    }

    function loadMoreReports() {
        visibleCount += PAGE_SIZE;
        renderReports();
    }

    function renderReports() {
        const gridContainer = document.getElementById('reportsGridContainer');
        const totalCountBadge = document.getElementById('totalReportsCount');
        const moreWrap = document.getElementById('loadMoreWrap');
        const moreBtn = document.getElementById('loadMoreBtn');
        if (!gridContainer) return;

        const sorted = Array.from(docsMap.values()).sort((a, b) => tsMillis(b) - tsMillis(a));
        totalCountBadge.innerText = `மொத்த புகார்கள்: ${sorted.length}`;

        if (sorted.length === 0) {
            gridContainer.innerHTML = `<div class="no-data">புதிய புகார்கள் எதுவும் இல்லை.</div>`;
            if (moreWrap) moreWrap.style.display = 'none';
            return;
        }

        const visible = sorted.slice(0, visibleCount);
        const frag = document.createDocumentFragment();
        visible.forEach(d => {
            let el = cardEls.get(d.id);
            if (!el || dirtyIds.has(d.id)) {
                el = buildCardEl(d);
                if (newIds.has(d.id)) el.classList.add('new-card');
                cardEls.set(d.id, el);
                dirtyIds.delete(d.id);
            }
            frag.appendChild(el);
        });
        gridContainer.replaceChildren(frag);

        // காட்டப்படாத புகார்களின் card நினைவகத்தை விடுவி
        const visibleSet = new Set(visible.map(d => d.id));
        cardEls.forEach((el, id) => { if (!visibleSet.has(id)) cardEls.delete(id); });

        const remaining = sorted.length - visible.length;
        if (moreWrap && moreBtn) {
            moreWrap.style.display = remaining > 0 ? 'block' : 'none';
            moreBtn.innerText = `⬇️ மேலும் ஏற்று (மீதம் ${remaining})`;
        }
    }

    function mediaEntry(item) {
        const url = typeof item === 'object' ? item.url : item;
        const lat = typeof item === 'object' && item.location ? item.location.lat : null;
        const lng = typeof item === 'object' && item.location ? item.location.lng : null;
        return { url, lat, lng };
    }

    function mapLink(lat, lng, label, extraStyle) {
        if (lat === null || lng === null || lat === undefined || lng === undefined) return '';
        const la = Number(lat), lo = Number(lng);
        if (!isFinite(la) || !isFinite(lo)) return '';
        return `<a href="https://www.google.com/maps?q=${la},${lo}" target="_blank" rel="noopener" class="action-btn btn-map" ${extraStyle ? `style="${extraStyle}"` : ''}>${label}</a>`;
    }

    function fmtDist(m) {
        if (m === null || m === undefined) return '—';
        return m >= 1000 ? (m / 1000).toFixed(1) + ' கி.மீ' : m + ' மீ';
    }
    function fmtAge(min) {
        if (min === null || min === undefined) return '';
        if (min < 1) return '1 நிமிடத்திற்குள்';
        if (min < 60) return min + ' நிமிடம்';
        if (min < 1440) return Math.round(min / 60) + ' மணி நேரம்';
        return Math.round(min / 1440) + ' நாள்';
    }

    // ஒவ்வொரு படம்/வீடியோ/குரலுக்கும்: AI கண்டது/கேட்டது + இடம் + நேரம் (அதிகாரி சரிபார்க்க)
    function evidenceHtml(data) {
        const groups = [
            { label: 'படம்', icon: '🖼️', arr: data.imageUrls || [] },
            { label: 'வீடியோ', icon: '🎥', arr: data.videoUrls || [] },
            { label: 'குரல்', icon: '🎙️', arr: data.audioUrls || [] }
        ];
        let rows = '';
        groups.forEach(g => g.arr.forEach((it, i) => {
            if (!it || typeof it !== 'object') return;
            if (!(typeof it.aiRelevance === 'number' || it.locCheck || it.transcript)) return;
            const lines = [];
            if (typeof it.aiRelevance === 'number') {
                lines.push(`🤖 தொடர்பு ${it.aiRelevance}%${it.aiNote ? ' — ' + esc(it.aiNote) : ''}`);
            } else {
                lines.push('⚠️ AI பகுப்பாய்வு கிடைக்கவில்லை — கைமுறையாகப் பார்க்கவும்');
            }
            if (it.locCheck) {
                const srcTxt = it.locSource === 'exif' ? 'படம் எடுத்த இடம் (EXIF)'
                    : (it.locSource === 'device' ? 'கோப்பு இணைத்த நேரத்தில் சாதன GPS' : 'முக்கிய GPS மட்டும், தனி GPS கிடைக்கவில்லை');
                const icon = it.locCheck === 'match' ? '✅' : (it.locCheck === 'far' ? '⚠️' : 'ℹ️');
                const verdict = it.locCheck === 'match' ? 'புகார் இடத்துடன் பொருந்துகிறது'
                    : (it.locCheck === 'far' ? 'புகார் இடத்திலிருந்து தொலைவில் உள்ளது' : 'சரிபார்க்க இயலவில்லை');
                lines.push(`${icon} இடம்: ${fmtDist(it.distanceM)} — ${verdict} (${srcTxt}${it.locAccuracy != null ? ', ±' + esc(it.locAccuracy) + ' மீ' : ''})`);
            }
            if (it.viaCamera) {
                lines.push('✅ நேரம்: நேரடியாக எடுக்கப்பட்டது / பதிவு செய்யப்பட்டது');
            } else if (it.ageMin !== null && it.ageMin !== undefined) {
                const old = it.ageMin > 1440;
                lines.push(`${old ? '⚠️' : '🕒'} நேரம்: புகார் அனுப்பும் ${esc(fmtAge(it.ageMin))} முன் எடுக்கப்பட்ட கோப்பு${old ? ' (பழையது)' : ''}`);
            }
            if (it.transcript) lines.push(`🗣️ குரல் எழுத்து: <i>${esc(it.transcript)}</i>`);
            rows += `<div class="ev-row"><b>${g.icon} ${g.label} ${i + 1}</b><br>${lines.join('<br>')}</div>`;
        }));
        if (!rows) return '';
        return `<div class="evidence-box"><b>📎 ஆதார விவரம் (AI கண்டது/கேட்டது, இடம், நேரம்):</b>${rows}</div>`;
    }

    // AI அல்லது பதிவேற்றம் தோல்வியடைந்தால் உண்மையான காரணத்தைக் காட்டும்
    function errorHtml(data) {
        const model = data.aiModelUsed ? `<div style="font-size:10px; color:#888; margin-bottom:8px;">AI மாடல்: ${esc(data.aiModelUsed)}</div>` : '';
        if (!data.mediaError) return model;
        return `<div class="err-box"><b>⚠️ AI / பதிவேற்றப் பிழை விவரம்:</b><br>${esc(data.mediaError)}</div>${model}`;
    }

    function buildCardEl(data) {
        const docId = data.id;
        let dateStr = "N/A";
        if (data.timestamp && data.timestamp.toDate) {
            dateStr = data.timestamp.toDate().toLocaleString('ta-IN');
        }

        const currentStatus = data.complaintStatus || "Pending";
        // புதிய index (aiVersion 2) சேமித்த உண்மையான AI மதிப்பெண்ணைப் பயன்படுத்து; பழைய புகார்களுக்கு பழைய முறை
        let aiEval;
        if (data.aiVersion === 2 && typeof data.aiScore === 'number' && Array.isArray(data.scoreBreakdown)) {
            const st = data.aiStatus === 'TRUE' ? 'TRUE (உண்மையானது)'
                : (data.aiStatus === 'ANALYZING' ? '⏳ AI பகுப்பாய்வு நடைபெறுகிறது' : 'SUSPICIOUS / பரிசீலனையில்');
            aiEval = { score: data.aiScore, status: st, reasons: data.scoreBreakdown, mainLat: data.latitude, mainLon: data.longitude };
        } else {
            aiEval = evaluateNarcoticsAI(data);
        }
        const accuracyScore = aiEval.score;
        const breakdownHtml = aiEval.reasons.map(r => `<li>${esc(r)}</li>`).join('');
        const badgeColorClass = accuracyScore >= 50 ? 'badge-true' : 'badge-suspicious';

        const aiCardHtml = `
            <div class="ai-analysis-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <b>🤖 அட்வான்ஸ்டு AI நர்கோடிக்ஸ் ஸ்கேனர் & மார்க்கிங்:</b>
                    <span class="badge ${badgeColorClass}" style="font-size: 11px; padding: 3px 8px;">${accuracyScore}% - ${esc(aiEval.status)}</span>
                </div>
                <div style="font-size: 11px; color: #555; margin-top: 4px;">
                    <div style="color: #a02622; font-size: 10px; margin-bottom: 3px;">⚠️ இந்த மதிப்பெண் புகார்தாரரின் சாதனத்தில் கணக்கிடப்பட்டது; சுயாதீனமாக உறுதிப்படுத்தப்படவில்லை. அதிகாரியின் ஆய்வே இறுதி.</div>
                    <b>மதிப்பீட்டு விவரங்கள்:</b>
                    <ul style="margin: 3px 0 0 15px; padding: 0;">${breakdownHtml}</ul>
                </div>
            </div>`;

        let mediaButtonsHtml = '';

        const imgs = data.imageUrls || [];
        if (imgs.length > 0) {
            imgs.forEach((img, i) => {
                const m = mediaEntry(img);
                mediaButtonsHtml += `<button class="action-btn btn-image media-open" data-type="image" data-url="${esc(m.url)}">🔍 படம் ${i + 1}</button>`;
                mediaButtonsHtml += mapLink(m.lat, m.lng, `📍 படம் ${i + 1} Loc`);
            });
        } else if (data.imageUrl) {
            mediaButtonsHtml += `<button class="action-btn btn-image media-open" data-type="image" data-url="${esc(data.imageUrl)}">🔍 படம்</button>`;
        }

        const vids = data.videoUrls || [];
        if (vids.length > 0) {
            vids.forEach((vid, i) => {
                const m = mediaEntry(vid);
                mediaButtonsHtml += `<button class="action-btn btn-video media-open" data-type="video" data-url="${esc(m.url)}">🎥 வீடியோ ${i + 1}</button>`;
                mediaButtonsHtml += mapLink(m.lat, m.lng, `📍 வீடியோ ${i + 1} Loc`);
            });
        } else if (data.videoUrl) {
            mediaButtonsHtml += `<button class="action-btn btn-video media-open" data-type="video" data-url="${esc(data.videoUrl)}">🎥 வீடியோ</button>`;
        }

        const auds = data.audioUrls || [];
        if (auds.length > 0) {
            auds.forEach((aud, i) => {
                const m = mediaEntry(aud);
                mediaButtonsHtml += `<button class="action-btn btn-voice media-open" data-type="audio" data-url="${esc(m.url)}">🔊 குரல் ${i + 1}</button>`;
                mediaButtonsHtml += mapLink(m.lat, m.lng, `📍 குரல் ${i + 1} Loc`);
            });
        } else if (data.audioUrl) {
            mediaButtonsHtml += `<button class="action-btn btn-voice media-open" data-type="audio" data-url="${esc(data.audioUrl)}">🔊 குரல்</button>`;
        }

        const mLat = Number(aiEval.mainLat), mLon = Number(aiEval.mainLon);
        let locationDisplayHtml = `📍 மாவட்டம்: ${esc(data.district || 'N/A')} | ஸ்டேஷன்: ${esc(data.policeStation || data.taluk || 'N/A')}`;
        if (aiEval.mainLat && aiEval.mainLon && isFinite(mLat) && isFinite(mLon)) {
            locationDisplayHtml += `<br><span style="color: #2e7d32; font-weight: bold;">🌐 நேரடி GPS லொகேஷன் மேப்:</span> Lat: ${mLat.toFixed(4)}, Lon: ${mLon.toFixed(4)}`;
            mediaButtonsHtml += mapLink(mLat, mLon, "📍 நேரடி GPS மேப் பார்க்க (Live Location Map)", "flex: 100%; margin-top: 4px;");
        } else {
            locationDisplayHtml += `<br><span style="color: #c9302c;">⚠️ லொகேஷன் தரவு இல்லை</span>`;
        }

        const opt = (v, label) => `<option value="${v}" ${currentStatus === v ? 'selected' : ''}>${label}</option>`;

        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
            <div class="report-card" data-id="${esc(docId)}">
                <div class="report-card-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" class="report-checkbox" value="${esc(docId)}" style="width: 16px; height: 16px; cursor: pointer;">
                        <span class="badge badge-true">ID: ${esc(data.trackingId || 'N/A')}</span>
                    </div>
                    <span style="font-size:11px;">${esc(dateStr)}</span>
                </div>
                <div class="report-location">${locationDisplayHtml}</div>
                <div class="report-details"><b>இடம்/தெரு:</b> ${esc(data.locationName || 'N/A')}<br><b>விவரம்:</b> ${esc(data.details || 'N/A')}${data.mediaPending ? '<br><b style="color:#c9302c;">⏳ படம் / வீடியோ / குரல் பதிவேற்றம் நடைபெறுகிறது...</b>' : ''}${data.submittedOffline ? '<br><b style="color:#8a6d3b;">📴 ஆஃப்லைனில் பதிவு செய்யப்பட்டது' + (data.clientTimeMs ? ' (' + esc(new Date(data.clientTimeMs).toLocaleString('ta-IN')) + ')' : '') + ' — உரை மட்டும்; கோப்புகள் இல்லை</b>' : ''}</div>

                ${aiCardHtml}
                ${evidenceHtml(data)}
                ${errorHtml(data)}

                <div class="status-box">
                    <b>📌 புகாரின் நிலை (Status Update):</b><br>
                    <select class="status-select" style="margin: 5px 0; font-size: 12px; padding: 5px;">
                        ${opt('Pending', 'Pending (நிலுவையில்)')}
                        ${opt('In Progress', 'In Progress (விசாரணையில்)')}
                        ${opt('Action Taken', 'Action Taken (நடவடிக்கை எடுக்கப்பட்டது)')}
                        ${opt('Resolved', 'Resolved / Closed (முடிவுற்றது)')}
                    </select>
                    <textarea class="note-input" placeholder="காவல்துறை அதிகாரி குறிப்பு..." style="font-size:12px; height:45px; margin-top:5px;">${esc(data.officerNote || '')}</textarea>
                    <button data-action="save" style="background:#2e7d32; padding:6px; font-size:12px; margin-top:5px; width:auto;">💾 சேமி</button>
                </div>

                <div class="report-actions">${mediaButtonsHtml}</div>
                ${isHQ() ? '<button data-action="delete" class="action-btn btn-delete">🗑️ இந்தப் புகாரை மட்டும் நீக்கு (HQ)</button>' : ''}
            </div>`;
        return wrapper.firstElementChild;
    }

    // ---------- Card பொத்தான்கள் (event delegation) ----------
    function onGridClick(e) {
        const mediaBtn = e.target.closest('.media-open');
        if (mediaBtn) { openMediaWindow(mediaBtn.dataset.url, mediaBtn.dataset.type); return; }

        const actBtn = e.target.closest('[data-action]');
        if (!actBtn) return;
        const card = actBtn.closest('.report-card');
        if (!card) return;
        const docId = card.dataset.id;
        if (actBtn.dataset.action === 'save') updateReportStatus(docId);
        else if (actBtn.dataset.action === 'delete') deleteSingleReport(docId);
    }

    function auditEntry(action, reportId, detail) {
        return {
            uid: adminProfile.uid, email: adminProfile.email || '', role: adminProfile.role,
            action: action, reportId: reportId || '', detail: String(detail || '').slice(0, 300),
            at: firebase.firestore.FieldValue.serverTimestamp()
        };
    }

    async function updateReportStatus(docId) {
        const card = cardEls.get(docId);
        if (!card) return;
        const statusEl = card.querySelector('.status-select');
        const noteEl = card.querySelector('.note-input');
        if (!statusEl || !noteEl) return;
        const data = docsMap.get(docId) || {};
        const ts = firebase.firestore.FieldValue.serverTimestamp();

        const run = (withPublic) => {
            const batch = db.batch();
            batch.update(db.collection("reports").doc(docId), {
                complaintStatus: statusEl.value, officerNote: noteEl.value.trim(),
                statusUpdatedAt: ts, statusUpdatedBy: adminProfile.email || adminProfile.uid
            });
            if (withPublic && data.trackingId) {
                batch.update(db.collection("public_status").doc(data.trackingId), { status: statusEl.value, updatedAt: ts });
            }
            batch.set(db.collection("audit_logs").doc(), auditEntry('status_update', docId, statusEl.value));
            return batch.commit();
        };

        try {
            try { await run(true); }
            catch (e) {
                // பழைய புகார்களுக்கு பொது நிலை ஆவணம் இல்லாமல் இருக்கலாம் — அது இல்லாமல் மீண்டும் முயல்
                if (e && e.code === 'not-found') await run(false); else throw e;
            }
            alert("✅ புகாரின் நிலை மாற்றப்பட்டது!");
        } catch (err) { alert("❌ பிழை: " + (err.code === 'permission-denied' ? 'அனுமதி இல்லை' : err.message)); }
    }

    function toggleSelectAllReports(masterCheckbox) {
        const checkboxes = document.querySelectorAll('.report-checkbox');
        checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
    }

    // நீக்குதல்: தலைமையகம் (HQ) மட்டும்; ஒவ்வொன்றும் தணிக்கைப் பதிவில் சேரும். "அனைத்தையும் நீக்கு" வசதி பாதுகாப்புக்காக நீக்கப்பட்டது.
    async function deleteReportsByIds(ids) {
        for (let i = 0; i < ids.length; i += 100) {
            const batch = db.batch();
            ids.slice(i, i + 100).forEach(id => {
                const d = docsMap.get(id) || {};
                batch.delete(db.collection("reports").doc(id));
                if (d.trackingId) batch.delete(db.collection("public_status").doc(d.trackingId));
                batch.set(db.collection("audit_logs").doc(), auditEntry('delete', id, d.trackingId || ''));
            });
            await batch.commit();
        }
    }

    async function deleteSelectedReports() {
        if (!isHQ()) { alert("⚠️ நீக்க தலைமையகத்துக்கு (HQ) மட்டுமே அனுமதி உள்ளது."); return; }
        const checkboxes = document.querySelectorAll('.report-checkbox:checked');
        if (checkboxes.length === 0) {
            alert("⚠️ தயவுசெய்து நீக்க வேண்டிய புகார்களைத் தேர்ந்தெடுக்கவும்!");
            return;
        }
        if (confirm(`⚠️ தேர்ந்தெடுக்கப்பட்ட ${checkboxes.length} புகார்களை நிரந்தரமாக நீக்க விரும்புகிறீர்களா? இது தணிக்கைப் பதிவில் சேரும்.`)) {
            try {
                await deleteReportsByIds(Array.from(checkboxes).map(cb => cb.value));
                const master = document.getElementById('selectAllCheckbox');
                if (master) master.checked = false;
                alert("✅ தேர்ந்தெடுக்கப்பட்ட புகார்கள் நீக்கப்பட்டன!");
            } catch (err) { alert("❌ பிழை: " + (err.code === 'permission-denied' ? 'அனுமதி இல்லை' : err.message)); }
        }
    }

    async function deleteSingleReport(docId) {
        if (!isHQ()) { alert("⚠️ நீக்க தலைமையகத்துக்கு (HQ) மட்டுமே அனுமதி உள்ளது."); return; }
        if (confirm("⚠️ உறுதியாக இந்தப் புகாரை நிரந்தரமாக நீக்க விரும்புகிறீர்களா? இது தணிக்கைப் பதிவில் சேரும்.")) {
            try {
                await deleteReportsByIds([docId]);
                alert("✅ புகார் நீக்கப்பட்டது!");
            } catch (err) { alert("❌ பிழை: " + (err.code === 'permission-denied' ? 'அனுமதி இல்லை' : err.message)); }
        }
    }
</script>

</body>
</html>
